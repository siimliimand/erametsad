name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Worker (OpenNext)
        run: pnpm --filter @eametsad/platform build:cf

      # Deploy must go through `wrangler deploy` with the repo's
      # apps/platform/wrangler.jsonc (main: src/do/index.ts shim) so the
      # Durable Object classes, send_email binding, queue consumer, cron
      # trigger, and D1 binding ship together. `opennextjs-cloudflare
      # deploy` would use its own generated fetch-only config and drop them.
      - name: Apply D1 migrations (remote)
        if: github.event_name == 'push'
        run: pnpm --filter @eametsad/platform exec wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare (production)
        if: github.event_name == 'push'
        run: pnpm --filter @eametsad/platform exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
